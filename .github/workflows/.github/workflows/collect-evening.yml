name: BOB晚间信源采集

on:
  schedule:
    # UTC 12:00 = 北京时间 20:00
    - cron: '0 12 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行采集脚本
        run: python3 collect_sources.py evening

      - name: 提交结果
        run: |
          git config user.name "BOB Collector"
          git config user.email "actions@github.com"
          git add latest_sources.md
          git diff --staged --quiet || git commit -m "晚间信源采集 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push
